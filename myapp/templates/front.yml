{{- if .Values.apps.front.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: front
spec:
  selector:
    app: front
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: front
spec:
  replicas: 2
  selector:
    matchLabels:
      app: front
  template:
    metadata:
      labels:
        app: front
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: front
      containers:
      - name: front
        image: {{ .Values.apps.front.image.repository }}:{{ .Values.apps.front.image.tag | default "latest" }} #leesanghoon94/front-local:v0.0.7
        imagePullPolicy: Always
        ports:
        - containerPort: 80

        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 1
          terminationGracePeriodSeconds: 30

        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 1
          

        resources:
        {{- toYaml .Values.apps.front.resources | nindent 12}}
{{- end }}