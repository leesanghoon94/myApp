{{- if .Values.apps.server.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: server
spec:
  ports:
    - port: 3333
      targetPort: 3333
  selector:
    app: server
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: server
  template:
    metadata:
      labels:
        app: server
    spec:
      containers:
        - name: server
          image: {{ .Values.apps.server.image.repository}}:{{ .Values.apps.server.image.tag | default latest }}
          imagePullPolicy: Always
          ports:
            - containerPort: 3333
          resources:
          {{- toYaml .Values.apps.server.resources | nindent 12}}
{{- end }}