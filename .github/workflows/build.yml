# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "myapp/values.yaml"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          aws-region: ap-northeast-2
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Check out repository code
        uses: actions/checkout@v6

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 이미지 태그
        id: image
        run: |
          VERSION=$(echo ${{ github.sha }} | cut -c1-5)
          echo VERSION=$VERSION
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: 프론트이미지 빌드 푸시
        id: front_image
        env:
          TAG: ${{ steps.image.outputs.version }}
          DOCKERID: leesanghoon94
        working-directory: front
        run: |
          npm install
          npm run build
          echo "image build and push~~~~~"
          docker build -t $DOCKERID/front-eks:$TAG . 
          docker push $DOCKERID/front-eks:$TAG

      - name: 서버 이미지 빌드 푸시
        id: server_image
        env:
          TAG: ${{ steps.image.outputs.version }}
          DOCKERID: leesanghoon94
        working-directory: server
        run: |
          npm install
          # echo "::set-output name=image_tag::$TAG"
          docker build -t $DOCKERID/server-eks:$TAG . 
          docker push $DOCKERID/server-eks:$TAG

    outputs:
      image_tag: ${{ steps.image.outputs.version }}
      sha: ${{ github.sha }}

  deploy:
    needs: build
    name: replace manifest image tag
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.build.outputs.image_tag }}
      GIT_ACCESS_TOKEN: ${{ secrets.ACTION_TOKEN }}
      HASH: ${{ needs.build.outputs.sha }}
      GIT_REPO: leesanghoon94/myApp

    steps:
      - name: Clone Deploy repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GIT_REPO }}
          ref: "main"
          token: ${{ env.GIT_ACCESS_TOKEN }}

      - name: 벨류파일이미지태그바꾸기
        uses: mikefarah/yq@master
        with:
          cmd: |
            yq e --inplace '.apps.front.image.tag = "${{ needs.build.outputs.image_tag }}"' myapp/values.yaml 
            yq e --inplace '.apps.server.image.tag = "${{ needs.build.outputs.image_tag }}"' myapp/values.yaml

      - name: 바뀐 파일 보기
        run: |
          git diff -- myapp/values.yaml

      - name: 바뀐 values.yml 깃커밋 푸시
        run: |
          git config user.name "leesanghoon94"
          git config user.email "isupperhoon@gmail.com"
          git add myapp/values.yaml
          git commit -m "chore: update image tag to ${{ needs.build.outputs.image_tag }}" || echo "No changes"
          git push

